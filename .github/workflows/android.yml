name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build Android
        run: |
          # تجهيز البيئة
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # تهيئة Capacitor (إيلا ماكانش)
          npx cap init "Belrhazi" "com.belrhazi.app" --web-dir . || true
          
          # إضافة منصة أندرويد وبناء الملف
          npx cap add android || true
          npx cap copy
          
          # الدخول لمجلد أندرويد وبناء الـ APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Belrhazi-Final-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
