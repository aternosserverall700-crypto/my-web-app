name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android App
        run: |
          # 1. تنظيف وتجهيز البيئة
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 2. كري ملفات Capacitor و Android من الزيرو
          npx cap init "Belrhazi" "com.belrhazi.app" --web-dir . || true
          npx cap add android || true
          npx cap copy
          
          # 3. بناء الـ APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Belrhazi-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
