name: Mobile APK Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install & Setup
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          echo '{"appId":"com.belrhazi.app","appName":"Belrhazi","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          cp index.html www/ || true
          npx cap add android || true
          
          # زيادة الصلاحيات (GPS & Storage) فملف المانيفست
          FILE="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $FILE
          sed -i '/<application/i <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $FILE
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $FILE
          sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $FILE
          
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Belrhazi-Power-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
