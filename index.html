<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#d4af37"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="بلغازي ديكور"/>
<meta name="description" content="إدارة عملاء بلغازي ديكور — يعمل بدون إنترنت"/>
<title>بلغازي ديكور — إدارة العملاء</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet"/>

<style>
/* ════════════════════════════════════════════
   RESET & TOKENS
════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#d4af37; --gold-l:#e8cc6a; --gold-d:#b8962c;
  --gold-bg:#fffdf4; --gold-ring:rgba(212,175,55,.18);
  --white:#fff; --bg:#fafaf8; --border:#e8e0c8;
  --text:#111; --muted:#6b6b6b; --faint:#aaa;
  --r:12px; --rl:18px; --rxl:22px;
  --shadow-sm:0 2px 12px rgba(0,0,0,.05);
  --shadow-gold:0 4px 20px rgba(212,175,55,.28);
}
html{scroll-behavior:smooth}
body{
  font-family:'Amiri',Georgia,serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
body.rtl{direction:rtl;text-align:right}
body.ltr{direction:ltr;text-align:left}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}

/* ════ ANIMATIONS ════ */
@keyframes fadeIn {from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.anim-in{animation:fadeIn .2s ease}
.anim-up{animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
.spin{animation:spin .8s linear infinite;display:inline-block}
.pulse{animation:pulse 1.5s ease infinite}

/* ════ UTILITY ════ */
.hidden{display:none!important}
.flex{display:flex}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.center{display:flex;align-items:center;justify-content:center}
.gap2{gap:8px}
.gap3{gap:12px}
.gap4{gap:16px}
.flex1{flex:1}
.shrink0{flex-shrink:0}
.w-full{width:100%}
.truncate{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ════ GOLD GRADIENT ════ */
.gold-grad{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-l) 50%,var(--gold-d) 100%)}

/* ════ HEADER ════ */
header{
  background:var(--white);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
  box-shadow:0 1px 8px rgba(212,175,55,.07);
}
.header-inner{
  max-width:960px;margin:0 auto;padding:13px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px}
.brand h1{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;line-height:1.1}
.brand p{font-size:9px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang-wrap{position:relative}
.lang-sel{
  appearance:none;background:var(--white);border:1px solid var(--border);
  color:var(--text);font-size:13px;font-family:'Amiri',serif;
  border-radius:10px;padding:7px 32px 7px 14px;cursor:pointer;outline:none;
  transition:border-color .2s;
}
body.rtl .lang-sel{padding:7px 14px 7px 32px}
.lang-sel:hover,.lang-sel:focus{border-color:var(--gold)}
.lang-chev{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--gold)}
body.rtl .lang-chev{right:auto;left:9px}

/* Status badges */
.status-badge{
  display:flex;align-items:center;gap:5px;padding:5px 10px;
  border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid;white-space:nowrap;
}
.badge-online{color:#059669;border-color:#a7f3d0;background:#ecfdf5}
.badge-offline{color:#d97706;border-color:#fde68a;background:#fffbeb}
.badge-saving{color:var(--gold);border-color:rgba(212,175,55,.3);background:var(--gold-bg)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-green{background:#10b981}
.dot-amber{background:#d97706}
.dot-gold{background:var(--gold)}

/* Install button */
.btn-install{
  display:none;align-items:center;gap:6px;
  padding:6px 14px;border-radius:10px;
  border:1.5px solid var(--gold);color:var(--gold);background:transparent;
  font-size:12px;font-weight:600;font-family:'Amiri',serif;cursor:pointer;
  transition:background .2s,color .2s;
}
.btn-install:hover{background:var(--gold);color:var(--white)}
.btn-install.visible{display:flex}

/* ════ MAIN ════ */
main{max-width:960px;margin:0 auto;padding:28px 20px}

/* ════ STATS ════ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:520px){.stats-grid{grid-template-columns:1fr}}
.stat-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--rl);padding:20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-sm);
}
.stat-icon{
  width:46px;height:46px;border-radius:14px;
  background:rgba(212,175,55,.1);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:4px;font-weight:600}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:1}
.gold-stat{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-l) 50%,var(--gold-d) 100%);
  border:none;box-shadow:var(--shadow-gold);position:relative;overflow:hidden;
}
.gold-stat::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.28) 0%,transparent 60%);
  pointer-events:none;
}
.gold-stat .stat-icon{background:rgba(255,255,255,.2)}
.gold-stat .stat-label{color:rgba(255,255,255,.82);position:relative;z-index:1}
.gold-stat .stat-val{color:var(--white);font-size:22px;position:relative;z-index:1}

/* ════ TOOLBAR ════ */
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
body.ltr .search-icon{right:auto;left:12px}
.search-input{
  width:100%;background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:11px 42px 11px 14px;
  font-size:14px;font-family:'Amiri',serif;color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
body.ltr .search-input{padding:11px 14px 11px 42px}
.search-input::placeholder{color:#bbb}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-ring)}
.btn-add{
  display:flex;align-items:center;gap:8px;padding:11px 22px;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));
  color:var(--white);border:none;border-radius:var(--r);
  font-size:14px;font-weight:600;font-family:'Amiri',serif;
  cursor:pointer;white-space:nowrap;
  box-shadow:0 4px 16px rgba(212,175,55,.38);
  transition:box-shadow .2s,transform .1s;
}
.btn-add:hover{box-shadow:0 6px 22px rgba(212,175,55,.52)}
.btn-add:active{transform:scale(.97)}
.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-export,.btn-import-lbl{
  display:flex;align-items:center;gap:6px;padding:9px 14px;
  border:1px solid var(--border);background:var(--white);
  border-radius:var(--r);font-size:12px;font-weight:600;
  font-family:'Amiri',serif;color:var(--muted);cursor:pointer;
  transition:border-color .2s,color .2s;
}
.btn-export:hover,.btn-import-lbl:hover{border-color:var(--gold);color:var(--gold)}

/* ════ SAVE INDICATOR ════ */
.save-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--gold-bg);border:1px solid rgba(212,175,55,.25);
  border-radius:10px;padding:8px 14px;margin-bottom:16px;
  font-size:12px;color:var(--muted);gap:10px;flex-wrap:wrap;
}
.save-dot{width:7px;height:7px;border-radius:50%;background:#10b981;flex-shrink:0}

/* ════ EMPTY STATE ════ */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 20px}
.empty-icon{
  width:78px;height:78px;border-radius:50%;
  background:rgba(212,175,55,.1);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;
}
.empty h3{font-size:19px;font-weight:700;margin-bottom:6px}
.empty p{font-size:14px;color:var(--muted);margin-bottom:20px}
.btn-add-first{
  display:flex;align-items:center;gap:8px;
  padding:11px 22px;border:2px solid var(--gold);
  background:transparent;color:var(--gold);border-radius:var(--r);
  font-size:14px;font-weight:600;font-family:'Amiri',serif;cursor:pointer;
  transition:background .2s,color .2s;
}
.btn-add-first:hover{background:var(--gold);color:var(--white)}

/* ════ CLIENT LIST ════ */
.clients-list{display:flex;flex-direction:column;gap:11px}
.client-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--rl);padding:18px 20px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s,border-color .2s;
}
.client-card:hover{box-shadow:var(--shadow-gold);border-color:rgba(212,175,55,.38)}
.card-top{display:flex;align-items:flex-start;gap:13px;margin-bottom:12px}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));
  color:var(--white);font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(212,175,55,.3);
}
.card-info{flex:1;min-width:0}
.name-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.client-name{font-size:15px;font-weight:700}
.badge{font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;flex-shrink:0}
.badge-paid{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
.badge-owed{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.meta-row{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12px;color:var(--muted);margin-bottom:9px}
.meta-item{display:flex;align-items:center;gap:4px}
.service-text{font-size:13px;color:#555;margin-bottom:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.fin-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:2px}
.fin-val{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:700}
.c-green{color:#059669}
.c-amber{color:#d97706}
.c-gold{color:var(--gold)}
.progress-bar{width:100%;height:5px;background:#f0ede5;border-radius:99px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;border-radius:99px;transition:width .5s ease}
.progress-full{background:linear-gradient(90deg,#10b981,#059669)}
.progress-partial{background:linear-gradient(90deg,var(--gold),var(--gold-d))}
.card-actions{display:flex;gap:8px}
body.ltr .card-actions{justify-content:flex-end}
.btn-edit,.btn-del{
  display:flex;align-items:center;gap:5px;padding:6px 13px;
  border-radius:8px;font-size:12px;font-weight:600;
  font-family:'Amiri',serif;cursor:pointer;border:1px solid;
  transition:background .15s;background:transparent;
}
.btn-edit{border-color:rgba(212,175,55,.35);color:var(--gold)}
.btn-edit:hover{background:rgba(212,175,55,.07)}
.btn-del{border-color:#fecaca;color:#ef4444}
.btn-del:hover{background:#fef2f2}

/* ════ OVERLAY ════ */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.52);backdrop-filter:blur(4px);
  z-index:200;align-items:flex-end;justify-content:center;
}
@media(min-width:600px){.overlay{align-items:center;padding:16px}}
.overlay.open{display:flex}

/* ════ MODAL ════ */
.modal{
  background:var(--white);width:100%;max-width:520px;
  border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;
}
@media(min-width:600px){.modal{border-radius:var(--rl)}}
.modal-head{
  position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--border);
  padding:15px 22px;display:flex;align-items:center;justify-content:space-between;z-index:10;
}
.modal-icon-box{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.modal-t{font-size:15px;font-weight:700}
.modal-st{font-size:11px;color:var(--faint);margin-top:1px}
.btn-close{
  width:30px;height:30px;border-radius:50%;border:none;background:transparent;
  color:#aaa;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.btn-close:hover{background:#f5f5f5;color:#555}
.modal-body{padding:18px 22px 28px;display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#555}
.form-input{
  width:100%;background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:11px 14px;font-size:14px;
  font-family:'Amiri',serif;color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.form-input::placeholder{color:#bbb}
.form-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-ring)}
.form-input.err{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.1)}
textarea.form-input{resize:vertical;min-height:76px}
.form-err{font-size:12px;color:#ef4444;display:none}
.form-err.show{display:block}
.loc-row{display:flex;gap:8px}
.loc-row .form-input{flex:1}
.btn-gps{
  width:46px;height:46px;flex-shrink:0;border:2px solid var(--gold);
  background:transparent;color:var(--gold);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,color .15s;
}
.btn-gps:hover{background:var(--gold);color:var(--white)}
.btn-gps:disabled{opacity:.5;cursor:not-allowed}
.gps-msg{font-size:12px;display:none}
.gps-msg.show{display:block}
.gps-load{color:var(--gold)}
.gps-err{color:#ef4444}
.remaining-box{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--gold-bg);border:2px solid rgba(212,175,55,.3);
  border-radius:var(--r);padding:11px 15px;
}
.remaining-box.paid{background:#ecfdf5;border-color:#a7f3d0}
.remaining-lbl{font-size:13px;font-weight:600;color:#444}
.remaining-val{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;color:var(--gold)}
.remaining-box.paid .remaining-val{color:#059669}
.form-actions{display:flex;gap:10px;margin-top:2px}
.btn-cancel{
  flex:1;padding:12px;background:transparent;border:1px solid var(--border);
  border-radius:var(--r);font-size:14px;font-weight:600;
  font-family:'Amiri',serif;color:#555;cursor:pointer;transition:background .15s;
}
.btn-cancel:hover{background:#f8f8f8}
.btn-submit{
  flex:2;padding:12px;border:none;border-radius:var(--r);
  background:linear-gradient(135deg,var(--gold),var(--gold-d));
  font-size:14px;font-weight:700;font-family:'Amiri',serif;color:var(--white);
  cursor:pointer;box-shadow:0 4px 16px rgba(212,175,55,.38);
  transition:box-shadow .2s,transform .1s;
}
.btn-submit:hover{box-shadow:0 6px 22px rgba(212,175,55,.52)}
.btn-submit:active{transform:scale(.97)}

/* ════ DELETE MODAL ════ */
.del-panel{
  background:var(--white);width:100%;max-width:360px;
  border-radius:var(--rxl);padding:30px 26px;text-align:center;margin:16px;
}
.del-icon{
  width:54px;height:54px;border-radius:50%;background:#fef2f2;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
}
.del-t{font-size:18px;font-weight:700;margin-bottom:6px}
.del-d{font-size:13px;color:var(--muted);margin-bottom:5px}
.del-n{font-size:14px;font-weight:700;margin-bottom:22px}
.del-actions{display:flex;gap:10px}
.btn-del-cancel{
  flex:1;padding:11px;border:1px solid var(--border);background:transparent;
  border-radius:var(--r);font-size:14px;font-weight:600;
  font-family:'Amiri',serif;color:#555;cursor:pointer;transition:background .15s;
}
.btn-del-cancel:hover{background:#f8f8f8}
.btn-del-confirm{
  flex:1;padding:11px;border:none;border-radius:var(--r);
  background:#ef4444;font-size:14px;font-weight:700;
  font-family:'Amiri',serif;color:var(--white);cursor:pointer;
  transition:background .15s,transform .1s;
}
.btn-del-confirm:hover{background:#dc2626}
.btn-del-confirm:active{transform:scale(.97)}

/* ════ TOAST ════ */
.toast{
  display:none;position:fixed;top:18px;left:20px;z-index:9999;pointer-events:none;
  background:var(--white);border:1px solid rgba(212,175,55,.3);border-radius:12px;
  padding:11px 18px;font-size:13px;font-weight:600;color:var(--text);
  box-shadow:0 4px 20px rgba(212,175,55,.22);align-items:center;gap:8px;
  max-width:300px;
}
body.ltr .toast{left:auto;right:20px}
.toast.show{display:flex;animation:fadeIn .25s ease}

/* ════ FOOTER ════ */
footer{text-align:center;padding:22px;font-size:11px;color:var(--faint);font-family:'Cormorant Garamond',serif}
</style>
</head>
<body class="rtl">

<!-- TOAST -->
<div id="toast" class="toast">
  <svg width="15" height="15" fill="none" stroke="var(--gold)" stroke-width="2.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
  </svg>
  <span id="toast-txt"></span>
</div>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 36 36" fill="none" style="flex-shrink:0">
        <polygon points="18,2 34,18 18,34 2,18" fill="none" stroke="#d4af37" stroke-width="1.5"/>

/* ─────────────────────────────────────────
   SERVICE WORKER REGISTRATION
   Works when served over HTTP/HTTPS.
   On first load it caches the page; after
   that the app loads fully offline.
───────────────────────────────────────── */
(function registerSW() {
  if (!("serviceWorker" in navigator)) return;

  var SW_JS = [
    "var CACHE = 'belrhazi-v3';",
    "var OFFLINE = [];",
    "self.addEventListener('install', function(e) {",
    "  e.waitUntil(",
    "    caches.open(CACHE).then(function(c) {",
    "      try { return c.addAll(OFFLINE); } catch(x) { return Promise.resolve(); }",
    "    })",
    "  );",
    "  self.skipWaiting();",
    "});",
    "self.addEventListener('activate', function(e) {",
    "  e.waitUntil(self.clients.claim());",
    "  e.waitUntil(",
    "    caches.keys().then(function(keys) {",
    "      return Promise.all(keys.filter(function(k){ return k !== CACHE; }).map(function(k){ return caches.delete(k); }));",
    "    })",
    "  );",
    "});",
    "self.addEventListener('fetch', function(e) {",
    "  if (e.request.method !== 'GET') return;",
    "  e.respondWith(",
    "    caches.match(e.request).then(function(cached) {",
    "      var net = fetch(e.request).then(function(res) {",
    "        if (res && res.status === 200 && res.type === 'basic') {",
    "          var clone = res.clone();",
    "          caches.open(CACHE).then(function(c) { c.put(e.request, clone); });",
    "        }",
    "        return res;",
    "      });",
    "      return cached || net;",
    "    }).catch(function() { return caches.match(e.request); })",
    "  );",
    "});"
  ].join("\n");

  var blob = new Blob([SW_JS], { type: "text/javascript" });
  var url  = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).then(function(reg) {
    reg.update();
    document.getElementById("footer-pwa").textContent = "PWA ready";
  }).catch(function() {
    /* blob-URL SW blocked (file:// or strict CSP) — app still works offline via localStorage */
  });
})();

/* ─────────────────────────────────────────
   STATE
───────────────────────────────────────── */
var LANG = "ar";
var DEL_ID = null;
var installPrompt = null;
var toastTmr = null;
var STORE = "belrhazi_v3";

/* ─────────────────────────────────────────
   STORAGE — LocalStorage with auto-save
───────────────────────────────────────── */
function loadClients() {
  try { return JSON.parse(localStorage.getItem(STORE) || "[]"); }
  catch(e) { return []; }
}

function saveClients(list) {
  try {
    localStorage.setItem(STORE, JSON.stringify(list));
    localStorage.setItem(STORE + "_ts", new Date().toISOString());
    updateSaveBar();
  } catch(e) {
    toast("⚠ تعذر الحفظ — الذاكرة ممتلئة");
  }
}

function updateSaveBar() {
  var ts = localStorage.getItem(STORE + "_ts");
  var t  = TX[LANG];
  setText("save-txt", t.savedBar);
  if (ts) {
    try {
      var d = new Date(ts);
      var timeStr = d.toLocaleTimeString(LANG === "ar" ? "ar-MA" : "en-GB",
        { hour: "2-digit", minute: "2-digit" });
      setText("last-saved", t.lastSaved + timeStr);
    } catch(e) {}
  }
}

function uid() {
  return typeof crypto !== "undefined" && crypto.randomUUID
    ? crypto.randomUUID()
    : "c" + Date.now().toString(36) + Math.random().toString(36).slice(2);
}

/* ─────────────────────────────────────────
   EXPORT / IMPORT
───────────────────────────────────────── */
function exportData() {
  var data = {
    appVersion: "belrhazi-v3",
    exportedAt: new Date().toISOString(),
    clients: loadClients()
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: "application/json" });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href     = url;
  a.download = "belrhazi-clients-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(TX[LANG].tExported);
}

function importData(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parsed = JSON.parse(e.target.result);
      var list = Array.isArray(parsed) ? parsed
               : (parsed.clients && Array.isArray(parsed.clients)) ? parsed.clients
               : null;
      if (!list) throw new Error("Invalid format");
      saveClients(list);
      toast(TX[LANG].tImported);
      renderStats();
      renderClients();
    } catch(err) {
      toast("⚠ ملف غير صالح");
    }
  };
  reader.readAsText(file);
}

/* ─────────────────────────────────────────
   NETWORK STATUS
───────────────────────────────────────── */
function setNetStatus(online) {
  var badge = $("net-badge");
  var dot   = $("net-dot");
  var txt   = $("net-txt");
  if (online) {
    badge.className = "status-badge badge-online";
    dot.className   = "dot dot-green";
    txt.textContent = TX[LANG].netOnline;
  } else {
    badge.className = "status-badge badge-offline";
    dot.className   = "dot dot-amber";
    txt.textContent = TX[LANG].netOffline;
    toast("📴 " + (LANG === "ar" ? "غير متصل — التطبيق يعمل بدون إنترنت" : "Offline — app works without internet"));
  }
}

/* ─────────────────────────────────────────
   STATS
───────────────────────────────────────── */
function renderStats() {
  var clients = loadClients();
  var outstanding = 0;
  for (var i = 0; i < clients.length; i++) {
    var r = clients[i].totalPrice - clients[i].amountPaid;
    if (r > 0) outstanding += r;
  }
  setText("stat-c-val", String(clients.length));
  setText("stat-b-val", TX[LANG].fmt(outstanding.toFixed(2)));
}

/* ─────────────────────────────────────────
   RENDER CLIENTS
───────────────────────────────────────── */
function renderClients() {
  var tx  = TX[LANG];
  var q   = ($("search").value || "").toLowerCase().trim();
  var all = loadClients();
  var list = q ? all.filter(function(c) {
    return c.name.toLowerCase().indexOf(q) !== -1
      || c.phone.indexOf(q) !== -1
      || (c.serviceDetails || "").toLowerCase().indexOf(q) !== -1;
  }) : all;

  var wrap = $("client-list");

  if (list.length === 0) {
    var btn = all.length === 0
      ? '<button id="btn-empty" class="btn-add-first"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>' + esc(tx.addFirstBtn) + "</button>"
      : "";
    wrap.innerHTML = '<div class="empty">'
      + '<div class="empty-icon"><svg width="36" height="36" fill="none" stroke="#d4af37" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>'
      + '<h3>' + esc(tx.noClients) + '</h3>'
      + '<p>'  + esc(tx.noClientsDesc) + '</p>'
      + btn + '</div>';
    var eb = $("btn-empty");
    if (eb) eb.addEventListener("click", openAdd);
    return;
  }

  var html = '<div class="clients-list">';
  for (var i = 0; i < list.length; i++) html += buildCard(list[i], tx);
  html += "</div>";
  wrap.innerHTML = html;

  wrap.querySelectorAll("[data-edit]").forEach(function(b) {
    b.addEventListener("click", function() { openEdit(this.getAttribute("data-edit")); });
  });
  wrap.querySelectorAll("[data-del]").forEach(function(b) {
    b.addEventListener("click", function() { openDel(this.getAttribute("data-del")); });
  });
}

function buildCard(c, tx) {
  var rem    = Math.max(0, c.totalPrice - c.amountPaid);
  var isPaid = rem === 0;
  var pct    = c.totalPrice > 0 ? Math.min(100, (c.amountPaid / c.totalPrice) * 100) : 0;
  var fmt    = TX[LANG].fmtS;
  var av     = c.name.length > 0 ? c.name[0].toUpperCase() : "?";
  var dateStr = "";
  try {
    dateStr = new Date(c.createdAt).toLocaleDateString(
      LANG === "ar" ? "ar-MA" : "en-GB",
      { year:"numeric", month:"short", day:"numeric" }
    );
  } catch(e) { dateStr = (c.createdAt || "").slice(0,10); }

  var locHtml = c.location
    ? '<span class="meta-item truncate" style="max-width:180px">'
        + '<svg width="11" height="11" fill="none" stroke="#d4af37" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>'
        + esc(c.location) + '</span>'
    : "";

  return '<div class="client-card">'
    + '<div class="card-top">'
      + '<div class="avatar">' + esc(av) + '</div>'
      + '<div class="card-info">'
        + '<div class="name-row">'
          + '<span class="client-name">' + esc(c.name) + '</span>'
          + '<span class="badge ' + (isPaid ? 'badge-paid' : 'badge-owed') + '">' + esc(isPaid ? tx.badgePaid : tx.badgeOwed) + '</span>'
        + '</div>'
        + '<div class="meta-row">'
          + '<span class="meta-item"><svg width="11" height="11" fill="none" stroke="#d4af37" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg><span dir="ltr">' + esc(c.phone) + '</span></span>'
          + locHtml
          + '<span style="font-size:11px;color:#ccc">' + esc(dateStr) + '</span>'
        + '</div>'
        + '<div class="service-text">' + esc(c.serviceDetails) + '</div>'
        + '<div class="fin-grid">'
          + finCol(tx.colT, fmt(c.totalPrice.toFixed(2)), "")
          + finCol(tx.colP, fmt(c.amountPaid.toFixed(2)), "c-green")
          + finCol(tx.colR, fmt(rem.toFixed(2)), isPaid ? "c-green" : "c-amber")
        + '</div>'
        + '<div class="progress-bar"><div class="progress-fill ' + (isPaid ? 'progress-full' : 'progress-partial') + '" style="width:' + pct + '%"></div></div>'
      + '</div>'
    + '</div>'
    + '<div class="card-actions">'
      + '<button class="btn-edit" data-edit="' + esc(c.id) + '">'
          + '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>'
          + esc(tx.btnEdit)
      + '</button>'
      + '<button class="btn-del" data-del="' + esc(c.id) + '">'
          + '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>'
          + esc(tx.btnDel)
      + '</button>'
    + '</div>'
  + '</div>';
}

function finCol(lbl, val, cls) {
  return '<div><div class="fin-label">' + esc(lbl) + '</div>'
       + '<div class="fin-val ' + cls + '">' + esc(val) + '</div></div>';
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ─────────────────────────────────────────
   OVERLAYS
───────────────────────────────────────── */
function showOv(id)  { var e=$(id); if(e){ e.classList.add("open"); e.classList.add("anim-in"); } }
function hideOv(id)  { var e=$(id); if(e) e.classList.remove("open"); }

/* ─────────────────────────────────────────
   ADD MODAL
───────────────────────────────────────── */
function openAdd() {
  var tx = TX[LANG];
  $("edit-id").value = "";
  $("f-name").value = $("f-phone").value = $("f-service").value = $("f-loc").value = "";
  $("f-total").value = $("f-paid").value = "";
  setText("modal-t",   tx.modalAddT);
  setText("modal-st",  tx.modalSub);
  setText("btn-submit",tx.btnCreate);
  setText("btn-cancel",tx.btnCancel);
  clearErrs();
  calcRem();
  showOv("form-ov");
  setTimeout(function(){ $("f-name").focus(); }, 60);
}

/* ─────────────────────────────────────────
   EDIT MODAL
───────────────────────────────────────── */
function openEdit(id) {
  var tx = TX[LANG];
  var c  = loadClients().filter(function(x){ return x.id === id; })[0];
  if (!c) return;
  $("edit-id").value    = c.id;
  $("f-name").value     = c.name;
  $("f-phone").value    = c.phone;
  $("f-service").value  = c.serviceDetails;
  $("f-loc").value      = c.location || "";
  $("f-total").value    = String(c.totalPrice);
  $("f-paid").value     = String(c.amountPaid);
  setText("modal-t",   tx.modalEditT);
  setText("modal-st",  tx.modalSub);
  setText("btn-submit",tx.btnUpdate);
  setText("btn-cancel",tx.btnCancel);
  clearErrs();
  calcRem();
  showOv("form-ov");
  setTimeout(function(){ $("f-name").focus(); }, 60);
}

function closeForm(){ hideOv("form-ov"); }

/* ─────────────────────────────────────────
   DELETE MODAL
───────────────────────────────────────── */
function openDel(id) {
  var c = loadClients().filter(function(x){ return x.id === id; })[0];
  if (!c) return;
  DEL_ID = id;
  var tx = TX[LANG];
  setText("del-t",       tx.delT);
  setText("del-d",       tx.delD);
  setText("del-cancel",  tx.delCancel);
  setText("del-confirm", tx.delOk);
  setText("del-n", "\u201C" + c.name + "\u201D");
  showOv("del-ov");
}

function closeDel(){ DEL_ID = null; hideOv("del-ov"); }

function confirmDel() {
  if (!DEL_ID) return;
  saveClients(loadClients().filter(function(c){ return c.id !== DEL_ID; }));
  closeDel();
  toast(TX[LANG].tDeleted);
  renderStats();
  renderClients();
}

/* ─────────────────────────────────────────
   AUTO-CALCULATED REMAINING BALANCE
───────────────────────────────────────── */
function calcRem() {
  var total = parseFloat($("f-total").value) || 0;
  var paid  = parseFloat($("f-paid").value)  || 0;
  var rem   = Math.max(0, total - paid);
  var box   = $("rem-box");
  var val   = $("rem-val");
  if (!box || !val) return;
  val.textContent = TX[LANG].fmt(rem.toFixed(2));
  if (rem === 0 && total > 0) {
    box.classList.add("paid");
    val.style.color = "#059669";
  } else {
    box.classList.remove("paid");
    val.style.color = "var(--gold)";
  }
}

/* ─────────────────────────────────────────
   GPS
───────────────────────────────────────── */
function startGPS() {
  var tx  = TX[LANG];
  var btn = $("btn-gps");
  var msg = $("gps-msg");
  if (!navigator.geolocation) {
    msg.textContent = tx.gpsErr;
    msg.className   = "gps-msg show gps-err";
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></span>';
  msg.textContent = tx.gpsLoad;
  msg.className   = "gps-msg show gps-load";
  navigator.geolocation.getCurrentPosition(
    function(p) {
      $("f-loc").value = p.coords.latitude.toFixed(6) + ", " + p.coords.longitude.toFixed(6);
      btn.disabled = false; btn.innerHTML = gpsIcon();
      msg.className = "gps-msg";
    },
    function() {
      btn.disabled = false; btn.innerHTML = gpsIcon();
      msg.textContent = tx.gpsErr;
      msg.className   = "gps-msg show gps-err";
    },
    { timeout:10000, enableHighAccuracy:true }
  );
}

function gpsIcon() {
  return '<svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'
    + '<path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>'
    + '<path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>';
}

/* ─────────────────────────────────────────
   FORM SUBMIT (SAVE)
───────────────────────────────────────── */
function submitForm() {
  var tx      = TX[LANG];
  var name    = ($("f-name").value    || "").trim();
  var phone   = ($("f-phone").value   || "").trim();
  var service = ($("f-service").value || "").trim();
  var loc     = ($("f-loc").value     || "").trim();
  var total   = parseFloat($("f-total").value);
  var paid    = parseFloat($("f-paid").value);
  var editId  = $("edit-id").value;

  clearErrs();
  var ok = true;
  if (!name)        { showErr("name",    tx.errName);    ok = false; }
  if (!phone)       { showErr("phone",   tx.errPhone);   ok = false; }
  if (!service)     { showErr("service", tx.errService); ok = false; }
  if (isNaN(total)) { showErr("total",   tx.errTotal);   ok = false; }
  if (isNaN(paid))  { showErr("paid",    tx.errPaid);    ok = false; }
  if (!ok) return;

  var clients = loadClients();
  if (editId) {
    for (var i = 0; i < clients.length; i++) {
      if (clients[i].id === editId) {
        clients[i].name = name; clients[i].phone = phone;
        clients[i].serviceDetails = service; clients[i].location = loc;
        clients[i].totalPrice = total; clients[i].amountPaid = paid;
        break;
      }
    }
    saveClients(clients);
    closeForm();
    toast(tx.tUpdated);
  } else {
    clients.unshift({ id:uid(), name:name, phone:phone, serviceDetails:service,
                      location:loc, totalPrice:total, amountPaid:paid,
                      createdAt:new Date().toISOString() });
    saveClients(clients);
    closeForm();
    toast(tx.tAdded);
  }
  renderStats();
  renderClients();
}

/* ─────────────────────────────────────────
   ERRORS
───────────────────────────────────────── */
function showErr(f, msg) {
  var inp = $("f-"+f), err = $("err-"+f);
  if (inp) inp.classList.add("err");
  if (err) { err.textContent = msg; err.classList.add("show"); }
}
function clearErr(f) {
  var inp = $("f-"+f), err = $("err-"+f);
  if (inp) inp.classList.remove("err");
  if (err) { err.textContent = ""; err.classList.remove("show"); }
}
function clearErrs() {
  ["name","phone","service","total","paid"].forEach(clearErr);
  var gm = $("gps-msg");
  if (gm) { gm.className = "gps-msg"; gm.textContent = ""; }
}

/* ─────────────────────────────────────────
   TOAST
───────────────────────────────────────── */
function toast(msg) {
  var box = $("toast");
  $("toast-txt").textContent = msg;
  box.classList.add("show");
  clearTimeout(toastTmr);
  toastTmr = setTimeout(function(){ box.classList.remove("show"); }, 3200);
}

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
document.addEventListener("DOMContentLoaded", function() {

  /* --- Language --- */
  $("lang-sel").addEventListener("change", function() { setLang(this.value); });

  /* --- Add button --- */
  $("btn-add").addEventListener("click", openAdd);

  /* --- Form modal close/submit --- */
  $("btn-close").addEventListener("click", closeForm);
  $("btn-cancel").addEventListener("click", closeForm);
  $("btn-submit").addEventListener("click", submitForm);
  $("form-ov").addEventListener("click", function(e){ if(e.target===this) closeForm(); });

  /* --- Delete modal --- */
  $("del-cancel").addEventListener("click",  closeDel);
  $("del-confirm").addEventListener("click", confirmDel);
  $("del-ov").addEventListener("click", function(e){ if(e.target===this) closeDel(); });

  /* --- GPS --- */
  $("btn-gps").addEventListener("click", startGPS);

  /* --- Real-time balance calc --- */
  $("f-total").addEventListener("input", calcRem);
  $("f-paid").addEventListener("input",  calcRem);

  /* --- Clear errors on type --- */
  ["name","phone","service","total","paid"].forEach(function(f) {
    var el = $("f-"+f);
    if (el) el.addEventListener("input", function(){ clearErr(f); });
  });

  /* --- Search --- */
  $("search").addEventListener("input", renderClients);

  /* --- Export / Import --- */
  $("btn-export").addEventListener("click", exportData);
  $("file-import").addEventListener("change", function(){ importData(this.files[0]); this.value=""; });

  /* --- Network status --- */
  window.addEventListener("online",  function(){ setNetStatus(true); });
  window.addEventListener("offline", function(){ setNetStatus(false); });
  setNetStatus(navigator.onLine);

  /* --- PWA install prompt --- */
  window.addEventListener("beforeinstallprompt", function(e) {
    e.preventDefault();
    installPrompt = e;
    var btn = $("btn-install");
    btn.classList.add("visible");
    btn.addEventListener("click", function() {
      installPrompt.prompt();
      installPrompt.userChoice.then(function(r) {
        if (r.outcome === "accepted") btn.classList.remove("visible");
        installPrompt = null;
      });
    });
  });
  window.addEventListener("appinstalled", function() {
    $("btn-install").classList.remove("visible");
    toast(LANG === "ar" ? "تم تثبيت التطبيق بنجاح 🎉" : "App installed successfully 🎉");
  });

  /* --- Escape key --- */
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") { closeForm(); closeDel(); }
  });

  /* --- Initial render --- */
  applyTX();
  renderStats();
  renderClients();
});
</script>
</body>
</html>
