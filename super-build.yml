name: Mobile APK Build
on: [push]

jobs:
  make-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node & Java
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build From Scratch
        run: |
          # تجهيز كلشي أوتوماتيكياً
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # كري ملف الإعدادات باش ما يوقفش
          echo '{"appId":"com.belrhazi.app","appName":"Belrhazi","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
          
          # بناء أندرويد
          npx cap add android || true
          npx cap sync
          
          # الدخول لبناء الـ APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Download Link
        uses: actions/upload-artifact@v3
        with:
          name: Belrhazi-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
